<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatame Pro - Sistema de Placar e Chaves</title>
  
  <!-- Biblioteca do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0f1117;
      --surface-dark: #1a1d24;
      --surface-card: #222631;
      --border-color: #2f3542;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    html, body { min-height: 100vh; width: 100vw; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; overflow-x: hidden; }

    /* TELA DE AUTENTICAÇÃO */
    #auth-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; z-index: 99999; }
    .auth-card { background: var(--surface-dark); border: 1px solid var(--border-color); border-radius: 14px; width: 90%; max-width: 400px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .auth-card h2 { color: var(--accent-blue); text-align: center; margin-bottom: 6px; text-transform: uppercase; font-size: 1.4rem; font-weight: 800; }
    .auth-card p { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
    .auth-form-group { margin-bottom: 15px; }
    .auth-form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; }
    .auth-form-group input { width: 100%; padding: 12px; background: var(--surface-card); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 0.95rem; }
    .auth-form-group input:focus { outline: none; border-color: var(--accent-blue); }
    
    .auth-btn { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.95rem; text-transform: uppercase; margin-top: 5px; transition: background 0.2s; }
    .auth-btn:hover { background: #15803d; }
    
    .auth-switch { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-muted); }
    .auth-switch span { color: var(--accent-blue); text-decoration: none; font-weight: 700; cursor: pointer; display: inline-block; padding: 5px; }
    .auth-switch span:hover { text-decoration: underline; }

    /* APLICAÇÃO PRINCIPAL */
    #app-container { display: none; flex-direction: column; flex-grow: 1; width: 100%; }
    nav.top-nav { background: var(--surface-dark); display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border-color); }
    .nav-links { display: flex; gap: 12px; }
    .nav-btn { background: var(--surface-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 20px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    .nav-btn.active { background: #2563eb; color: white; border-color: #3b82f6; }
    .btn-logout { background: rgba(220, 38, 38, 0.15); color: #f87171; border-color: rgba(220, 38, 38, 0.3); }

    .tab-content { display: none; flex-direction: column; flex-grow: 1; padding: 20px; }
    .tab-content.active { display: flex; }
    
    .welcome-panel { background: var(--surface-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; text-align: center; max-width: 600px; margin: 40px auto; }
    .welcome-panel h3 { color: var(--accent-gold); margin-bottom: 10px; font-size: 1.5rem; }
    .welcome-panel p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN / CADASTRO -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">Tatame Pro</h2>
      <p id="auth-subtitle">Faça login para acessar o sistema</p>
      
      <div class="auth-form-group">
        <label>E-mail</label>
        <input type="email" id="auth-email" placeholder="seu-email@exemplo.com">
      </div>
      
      <div class="auth-form-group">
        <label>Senha</label>
        <input type="password" id="auth-pass" placeholder="Digite sua senha">
      </div>

      <button class="auth-btn" id="auth-submit-btn">Entrar</button>
      
      <div class="auth-switch">
        <span id="auth-switch-text">Não tem uma conta?</span> 
        <span id="auth-switch-link" style="color: var(--accent-blue); font-weight: bold;">Criar Cadastro</span>
      </div>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app-container">
    <nav class="top-nav">
      <div class="nav-links">
        <button class="nav-btn active" id="btn-tab-home" onclick="switchTab('home')">🏠 Início</button>
      </div>
      <button class="nav-btn btn-logout" id="btn-logout">Sair</button>
    </nav>

    <div id="tab-home" class="tab-content active">
      <div class="welcome-panel">
        <h3>🥋 Bem-vindo ao Tatame Pro!</h3>
        <p>Sua autenticação com o Supabase ocorreu com sucesso. O sistema está pronto para gerenciar suas chaves e combates.</p>
      </div>
    </div>
  </div>

  <!-- SCRIPT INTEGRADO COM SUAS CREDENCIAIS REAIS -->
  <script>
    const SUPABASE_URL = 'https://afnigpphelliwetcgqoc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmbmlncHBoZWxsaXdldGNncW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDMzNTAsImV4cCI6MjEwMzkxOTM1MH0.z1EQj-qOsMic40lhaVdKn6Z8FJt9wSts6ujC1UMrfAs';

    let supabaseClient = null;
    let isLoginMode = true;

    try {
      if (window.supabase && SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.startsWith('eyJ')) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error("Erro ao iniciar Supabase:", err);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const authTitle = document.getElementById('auth-title');
      const authSubtitle = document.getElementById('auth-subtitle');
      const authSubmitBtn = document.getElementById('auth-submit-btn');
      const authSwitchLink = document.getElementById('auth-switch-link');
      const authSwitchText = document.getElementById('auth-switch-text');
      
      const emailInput = document.getElementById('auth-email');
      const passInput = document.getElementById('auth-pass');
      
      const authScreen = document.getElementById('auth-screen');
      const appContainer = document.getElementById('app-container');
      const logoutBtn = document.getElementById('btn-logout');

      // Alternar Login <-> Cadastro
      authSwitchLink.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
          authTitle.innerText = 'Tatame Pro';
          authSubtitle.innerText = 'Faça login para acessar o sistema';
          authSubmitBtn.innerText = 'Entrar';
          authSwitchText.innerText = 'Não tem uma conta?';
          authSwitchLink.innerText = 'Criar Cadastro';
        } else {
          authTitle.innerText = 'Criar Conta';
          authSubtitle.innerText = 'Cadastre-se para gerenciar seus torneios';
          authSubmitBtn.innerText = 'Cadastrar';
          authSwitchText.innerText = 'Já tem uma conta?';
          authSwitchLink.innerText = 'Fazer Login';
        }
      });

      // Ação do Botão Principal (Entrar / Cadastrar)
      authSubmitBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passInput.value.trim();

        if (!email || !password) {
          alert('Por favor, preencha o e-mail e a senha.');
          return;
        }

        if (!supabaseClient) {
          alert('Erro: Supabase não inicializou.');
          return;
        }

        if (isLoginMode) {
          // Processo de Login
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            alert('Erro ao entrar: ' + error.message);
          } else {
            checkSession();
          }
        } else {
          // Processo de Cadastro
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) {
            alert('Erro no cadastro: ' + error.message);
          } else {
            alert('Cadastro realizado com sucesso! Agora faça o login.');
            authSwitchLink.click(); // Volta para a tela de login
          }
        }
      });

      // Botão Sair
      logoutBtn.addEventListener('click', async () => {
        if (supabaseClient) {
          await supabaseClient.auth.signOut();
        }
        authScreen.style.display = 'flex';
        appContainer.style.display = 'none';
        emailInput.value = '';
        passInput.value = '';
      });

      // Checar sessão ativa ao carregar
      async function checkSession() {
        if (!supabaseClient) return;
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          authScreen.style.display = 'none';
          appContainer.style.display = 'flex';
        } else {
          authScreen.style.display = 'flex';
          appContainer.style.display = 'none';
        }
      }

      checkSession();
    });

    // Função auxiliar de abas
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
    }
  </script>
</body>
</html>
